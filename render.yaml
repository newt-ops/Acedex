services:
  - type: web
    name: acedex-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: "http://localhost:3000,http://localhost:5173,https://acedex.vercel.app,*"
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: UNITY_ADS_ANDROID_GAME_ID
        value: "6220248"
      - key: UNITY_ADS_IOS_GAME_ID
        value: "6220249"
      - key: UNITY_ADS_ANDROID_PLACEMENT
        value: "Rewarded_Android"
      - key: UNITY_ADS_IOS_PLACEMENT
        value: "Rewarded_iOS"
      - key: UNITY_ADS_SECRET_KEY
        sync: false
      - key: UNITY_ADS_S2S_REQUIRED
        value: "false"
      - key: REQUIRE_EXAM_TICKET
        value: "false"
